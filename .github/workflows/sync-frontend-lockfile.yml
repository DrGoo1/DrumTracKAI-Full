name: Sync frontend package lock

on:
  push:
    branches:
      - sync/render-main
    paths:
      - "frontend/package.json"
      - ".github/workflows/sync-frontend-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-frontend-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: sync/render-main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate package lock deterministically
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile update when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "Update frontend lockfile for Supabase client"
          git push origin HEAD:sync/render-main
