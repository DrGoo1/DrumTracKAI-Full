name: Agent control plane validation

on:
  push:
    paths:
      - ".ai/**"
      - "tools/agentctl.py"
      - ".github/ISSUE_TEMPLATE/agent-task.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/agents/**"
      - ".windsurf/**"
      - "docs/AI_ENGINEERING_CONTRACT.md"
      - "docs/AGENT_EXECUTION_MATRIX.md"
      - "docs/CROSS_REPO_DEPENDENCIES.md"
      - "AGENTS.md"
  pull_request:
    paths:
      - ".ai/**"
      - "tools/agentctl.py"
      - ".github/ISSUE_TEMPLATE/agent-task.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/agents/**"
      - ".windsurf/**"
      - "docs/AI_ENGINEERING_CONTRACT.md"
      - "docs/AGENT_EXECUTION_MATRIX.md"
      - "docs/CROSS_REPO_DEPENDENCIES.md"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Compile control-plane utility
        run: python -m py_compile tools/agentctl.py
      - name: Run control-plane self-test
        run: python tools/agentctl.py self-test
      - name: Validate examples
        run: python tools/agentctl.py examples validate
